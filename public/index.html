<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOCKFRONT</title>
<style>
  :root{ --amber:#f2b134; --ink:#141a1f; --pale:#eef2e6; --red:#e2412f; --teal:#3fc9a0; }
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Arial Black","Segoe UI Black",Impact,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body.playing{cursor:none}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;color:var(--pale);opacity:0;transition:opacity .25s}
  body.playing #hud{opacity:1}

  #cross{position:absolute;left:50%;top:50%;width:0;height:0;transition:opacity .15s}
  #cross i{position:absolute;background:var(--pale);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
  #cross .h{width:9px;height:3px;top:-1.5px} #cross .v{width:3px;height:9px;left:-1.5px}
  #cross .l{right:var(--gap)} #cross .r{left:var(--gap)} #cross .t{bottom:var(--gap)} #cross .b{top:var(--gap)}
  #cross .dot{width:3px;height:3px;left:-1.5px;top:-1.5px}
  #hitmark{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .08s}
  #hitmark i{position:absolute;width:3px;height:14px;background:var(--pale);left:-1.5px;top:-7px}
  #hitmark i:nth-child(1){transform:translate(-9px,-9px) rotate(45deg)}
  #hitmark i:nth-child(2){transform:translate(9px,-9px) rotate(-45deg)}
  #hitmark i:nth-child(3){transform:translate(-9px,9px) rotate(-45deg)}
  #hitmark i:nth-child(4){transform:translate(9px,9px) rotate(45deg)}
  #hitmark.on{opacity:1} #hitmark.kill i{background:var(--red);height:20px;top:-10px}
  #hitmark.headshot i{background:var(--amber);height:18px;top:-9px}
  #scope{position:absolute;inset:0;opacity:0;transition:opacity .08s;background:radial-gradient(circle at center,transparent 0,transparent 31vmin,rgba(0,0,0,.97) 32.5vmin)}
  #scope::before,#scope::after{content:"";position:absolute;left:50%;top:50%;background:rgba(20,26,31,.9)}
  #scope::before{width:70vmin;height:2px;transform:translate(-50%,-50%)} #scope::after{width:2px;height:70vmin;transform:translate(-50%,-50%)}
  #scope.on{opacity:1}
  #alarmbar{position:absolute;left:50%;top:132px;transform:translateX(-50%);width:220px;height:8px;background:rgba(20,26,31,.75);border:2px solid var(--ink);display:none} #alarmbar.on{display:block} #alarmbar span{position:absolute;left:0;top:-14px;font-family:Arial,sans-serif;font-size:9px;letter-spacing:3px;color:var(--pale);opacity:.6} #alarmhud{height:100%;background:var(--amber);transition:width .3s} #alarmbar.hot #alarmhud{background:var(--red)} #alarmbar.hot span{color:var(--red);opacity:1}
  .obj.exit{color:#3fc9a0} .obj.exit i{background:#3fc9a0}
  #wflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  body.inhub #health,body.inhub #ammo,body.inhub #top,body.inhub #cross{display:none}
  #uw{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(40,110,150,.38),rgba(20,60,90,.62));opacity:0;transition:opacity .25s;pointer-events:none} #uw.on{opacity:1}

  .obj{position:absolute;transform:translate(-50%,-50%);font-family:Arial,sans-serif;font-size:10.5px;letter-spacing:1px;color:var(--amber);text-align:center;pointer-events:none;text-shadow:1px 1px 0 var(--ink);transition:opacity .2s}
  .obj i{display:block;width:11px;height:11px;margin:0 auto 3px;background:var(--amber);transform:rotate(45deg);border:2px solid var(--ink)} .obj.armed{color:var(--red)} .obj.armed i{background:var(--red)}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:460px;background:rgba(14,18,22,.92);border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.5);padding:14px 18px;display:none;font-family:Arial,sans-serif}
  #board.on{display:block} #board .bt{font-family:"Arial Black",Impact,sans-serif;font-size:14px;letter-spacing:4px;color:var(--amber);margin-bottom:8px} #board .bf{font-size:10px;letter-spacing:2px;opacity:.5;margin-top:8px;text-align:right}
  #board table{width:100%;border-collapse:collapse;font-size:12px} #board th{text-align:left;font-size:10px;letter-spacing:2px;opacity:.55;padding:4px 8px;border-bottom:2px solid #2a3238} #board td{padding:6px 8px;border-bottom:1px solid #1f272e}
  #board tr.me td{color:var(--amber)} #board .tag{font-size:9px;letter-spacing:1px;border:1px solid var(--amber);color:var(--amber);padding:1px 4px;margin-left:6px;vertical-align:middle} #board .tag.duel{border-color:var(--red);color:var(--red)}
  #duelprompt{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(14,18,22,.9);border:3px solid var(--red);padding:12px 18px;font-family:Arial,sans-serif;font-size:13px;display:none;text-align:center;box-shadow:6px 6px 0 rgba(0,0,0,.5)} #duelprompt.on{display:block} #duelprompt b{font-family:"Arial Black",Impact,sans-serif;letter-spacing:2px;color:var(--red);display:block;margin-bottom:6px} #duelprompt kbd{background:var(--amber);color:var(--ink);padding:1px 6px;font-family:"Arial Black",Impact,sans-serif}
  #duelhud{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-family:"Arial Black",Impact,sans-serif;font-size:14px;letter-spacing:3px;color:var(--red);text-shadow:2px 2px 0 var(--ink);display:none} #duelhud.on{display:block} #duelhud span{color:var(--pale)}
  .roster{border:3px solid #2a3238;background:#10151a;font-family:Arial,sans-serif;font-size:12px} .roster .rr{display:grid;grid-template-columns:1fr 50px 50px 70px 90px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #1f272e} .roster .rr.hd{font-size:10px;letter-spacing:2px;opacity:.55} .roster .rr.me{color:var(--amber)} .roster .rr:last-child{border-bottom:0}
  .roster .dbtn{background:var(--red);color:var(--pale);font-family:"Arial Black",Impact,sans-serif;font-size:10px;letter-spacing:2px;padding:5px 8px;border:2px solid var(--ink);cursor:pointer;text-align:center} .roster .dbtn.off{background:#2a3238;cursor:default;opacity:.5} .roster .dbtn.pend{background:#5a4a34}
  .loginbox{border:3px solid #2a3238;background:#10151a;padding:12px 14px;display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:center;margin-bottom:14px;font-family:Arial,sans-serif;font-size:12px}
  .loginbox input{background:#0b0f12;border:2px solid #2a3238;color:var(--pale);font-family:Arial,sans-serif;font-size:12px;padding:7px 9px;width:100%;box-sizing:border-box;outline:none} .loginbox input:focus{border-color:var(--amber)}
  .loginbox .lb{background:var(--amber);color:var(--ink);font-family:"Arial Black",Impact,sans-serif;font-size:12px;letter-spacing:2px;padding:8px 14px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap} .loginbox .ls{grid-column:1/-1;opacity:.7;line-height:1.5}
  .lbl{font-family:Arial,sans-serif;font-size:10px;letter-spacing:2px;opacity:.6;margin-top:10px}
  #perkhud{position:absolute;left:50%;top:116px;transform:translateX(-50%);font-family:"Arial Black",Impact,sans-serif;font-size:13px;letter-spacing:3px;color:var(--amber);text-shadow:2px 2px 0 var(--ink);pointer-events:none}
  #perkbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;pointer-events:auto} #perkbox.on{display:block}
  #perkbox .pt{font-family:"Arial Black",Impact,sans-serif;font-size:18px;letter-spacing:5px;color:var(--amber);text-align:center;text-shadow:3px 3px 0 var(--ink);margin-bottom:12px}
  #perkbox .pr{display:flex;gap:14px} #perkbox .pk{width:210px;background:rgba(14,18,22,.94);border:3px solid #2a3238;padding:16px 14px 14px;cursor:pointer;position:relative;transition:transform .12s,border-color .12s;box-shadow:6px 6px 0 rgba(0,0,0,.5)}
  #perkbox .pk:hover{transform:translateY(-4px);border-color:var(--amber)} #perkbox .pk b{display:block;font-family:"Arial Black",Impact,sans-serif;font-size:34px;color:var(--amber);line-height:1;margin-bottom:8px}
  #perkbox .pn{font-family:"Arial Black",Impact,sans-serif;font-size:14px;letter-spacing:1px;color:var(--pale);margin-bottom:6px} #perkbox .pd{font-family:Arial,sans-serif;font-size:11.5px;line-height:1.45;opacity:.75}
  #perkbox .pkey{position:absolute;right:10px;top:10px;font-family:"Arial Black",Impact,sans-serif;font-size:11px;background:var(--amber);color:var(--ink);padding:2px 7px;border:2px solid var(--ink)}
  .panel{position:absolute;background:rgba(20,26,31,.72);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px rgba(238,242,230,.12);padding:10px 14px}
  #health{left:22px;bottom:22px;width:260px}
  #hpbar{height:16px;background:#2a3238;border:2px solid var(--ink);margin-top:6px;position:relative;overflow:hidden}
  #hpfill{height:100%;width:100%;background:var(--teal);transition:width .12s steps(6)}
  #hpnum{font-size:30px;line-height:1;letter-spacing:1px}
  #hplabel{font-size:11px;opacity:.7;font-family:Arial,sans-serif}
  #ammo{right:22px;bottom:22px;text-align:right;min-width:190px}
  #ammonum{font-size:38px;line-height:1;color:var(--amber)}
  #ammonum small{font-size:16px;color:var(--pale);opacity:.6}
  #slots{display:flex;gap:8px;justify-content:flex-end;margin-top:9px;font-family:Arial,sans-serif;font-size:10px}
  #slots span{width:96px;border:2px solid rgba(238,242,230,.14);opacity:.55;background:linear-gradient(180deg,rgba(34,42,49,.85),rgba(9,13,17,.92));position:relative;text-align:left;transition:opacity .14s,transform .14s,box-shadow .14s;clip-path:polygon(0 0,100% 0,100% 100%,9px 100%,0 calc(100% - 9px));overflow:hidden}
  #slots span.cur{border-color:var(--amber);opacity:1;transform:translateY(-6px);box-shadow:3px 3px 0 var(--ink),0 0 0 1px rgba(242,177,52,.4)}
  #slots span.low{border-color:rgba(226,65,47,.6)} #slots span.low i{color:var(--red)}
  #slots span img{display:block;width:96px;height:50px;object-fit:contain;background:radial-gradient(circle at 50% 45%,rgba(238,242,230,.1),transparent 70%);filter:saturate(.8) brightness(.92)}
  #slots span.cur img{filter:saturate(1.15) brightness(1.1)}
  #slots span em{display:block;font-style:normal;padding:2px 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
  #slots span b{position:absolute;left:5px;top:3px;font-family:"Arial Black",Impact,sans-serif;font-size:11px;color:var(--amber);text-shadow:1px 1px 0 rgba(0,0,0,.6)}
  #slots span i{position:absolute;right:5px;top:3px;font-style:normal;font-family:"Arial Black",Impact,sans-serif;font-size:12px;color:var(--pale)} #slots span i u{text-decoration:none;font-family:Arial,sans-serif;font-size:9px;opacity:.55}
  #slots span k{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(238,242,230,.12)} #slots span k::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--f);background:var(--amber);transition:width .15s} #slots span.low k::after{background:var(--red)}
  #slots span r{position:absolute;left:0;right:0;top:20px;text-align:center;font-family:"Arial Black",Impact,sans-serif;font-size:9px;letter-spacing:2px;color:var(--amber);background:rgba(9,13,17,.7);padding:2px 0}
  #ammo.empty #ammonum{color:var(--red);animation:jit .12s 3}
  @keyframes jit{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  #top{left:50%;top:18px;transform:translateX(-50%);text-align:center;padding:8px 22px;display:flex;gap:26px;align-items:baseline}
  #top b{font-size:22px;color:var(--amber)} #top span{font-size:11px;opacity:.7;font-family:Arial,sans-serif;display:block;margin-top:2px}
  #msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:54px;letter-spacing:4px;color:var(--amber);text-shadow:4px 4px 0 var(--ink);opacity:0;white-space:nowrap}
  #msg.show{animation:pop 2.2s ease-out}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(1.3)}12%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0}}
  #vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(180,20,10,.85) 100%);opacity:0}
  #flash{position:absolute;inset:0;background:rgba(226,65,47,.55);opacity:0}
  #hint{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:13px;opacity:.8;color:var(--amber);text-shadow:2px 2px 0 var(--ink)}

  /* ===== front end: sidebar + tabbed panes ===== */
  #loginscreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,26,31,.5),rgba(4,6,8,.96));z-index:20}
  #loginscreen.on{display:flex}
  .lcard{width:380px;background:#141a1f;border:4px solid var(--ink);box-shadow:10px 10px 0 rgba(0,0,0,.55),0 0 0 1px rgba(242,177,52,.18),0 0 60px rgba(242,177,52,.1);padding:28px 28px 22px;display:flex;flex-direction:column;gap:12px;animation:cardin .35s ease-out}
  .lbrand{font-size:40px;letter-spacing:4px;color:var(--amber);text-shadow:4px 4px 0 var(--ink);line-height:.95} .lbrand span{color:var(--pale)}
  .lsub{font-family:Arial,sans-serif;font-size:10px;letter-spacing:3px;opacity:.55;margin-bottom:6px}
  .lcard input{background:#0b0f12;border:2px solid #2a3238;color:var(--pale);font-family:Arial,sans-serif;font-size:14px;padding:11px 12px;outline:none} .lcard input:focus{border-color:var(--amber)}
  .lgo{margin-top:4px;padding:12px 0;text-align:center;background:var(--amber);color:var(--ink);font-size:20px;letter-spacing:4px;cursor:pointer;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)} .lgo:hover{transform:translate(-1px,-1px)}
  .lmsg{font-family:Arial,sans-serif;font-size:11px;min-height:16px;opacity:.75;line-height:1.5} .lmsg.bad{color:var(--red);opacity:1}
  .loff{font-family:Arial,sans-serif;font-size:11px;opacity:.5;text-align:center;cursor:pointer;text-decoration:underline} .loff:hover{opacity:.9}
  .lobbies{display:grid;gap:10px} .lob{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:3px solid #2a3238;background:#10151a;padding:12px 14px;font-family:Arial,sans-serif;font-size:12px}
  .lob .ln{font-family:"Arial Black",Impact,sans-serif;font-size:15px;letter-spacing:1px;color:var(--pale)} .lob .ld{opacity:.6;margin-top:3px} .lob .ld b{color:var(--amber);font-weight:normal}
  .lob .jb{background:var(--amber);color:var(--ink);font-family:"Arial Black",Impact,sans-serif;font-size:12px;letter-spacing:2px;padding:9px 16px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer} .lob .jb.off{background:#2a3238;color:var(--pale);opacity:.6;box-shadow:none;cursor:default}
  .createrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0} .createrow input{background:#0b0f12;border:2px solid #2a3238;color:var(--pale);font-family:Arial,sans-serif;font-size:12px;padding:9px 11px;outline:none}
  .roomcard{border:3px solid var(--amber);background:#10151a;padding:14px 16px;font-family:Arial,sans-serif;font-size:12px} .roomcard .rn{font-family:"Arial Black",Impact,sans-serif;font-size:18px;letter-spacing:2px;color:var(--amber)} .roomcard .rd{opacity:.65;margin:4px 0 10px}
  .roomcard .pl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px} .roomcard .pl div{background:#0b0f12;border:2px solid #232c34;padding:8px 10px;display:flex;justify-content:space-between;align-items:center} .roomcard .pl .rdy{font-size:9px;letter-spacing:2px;color:#3fc9a0} .roomcard .pl .wait{font-size:9px;letter-spacing:2px;opacity:.4}
  .roomcard .btns{display:flex;gap:10px} .roomcard .btns span{padding:9px 16px;border:2px solid var(--ink);font-family:"Arial Black",Impact,sans-serif;font-size:12px;letter-spacing:2px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)} .roomcard .btns .go{background:var(--amber);color:var(--ink)} .roomcard .btns .rd2{background:#3fc9a0;color:var(--ink)} .roomcard .btns .lv{background:#2a3238;color:var(--pale)}
  .cta.pulse{animation:ctapulse 1.1s ease-in-out infinite} @keyframes ctapulse{50%{box-shadow:5px 5px 0 var(--ink),0 0 30px rgba(242,177,52,.7)}}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,26,31,.35) 0%,rgba(6,9,11,.82) 70%,rgba(4,6,8,.94) 100%);color:var(--pale);padding:18px;box-sizing:border-box;overflow:hidden}
  #menu::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);pointer-events:none;opacity:.55}
  #menu::after{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(180deg,transparent,rgba(242,177,52,.10),transparent);animation:sweep 7s linear infinite;pointer-events:none}
  @keyframes sweep{to{transform:translateY(350%)}}
  #menu.hidden{display:none}
  .shell{display:grid;grid-template-columns:300px 1fr;width:min(1140px,100%);height:min(740px,94vh);border:4px solid var(--ink);box-shadow:10px 10px 0 rgba(0,0,0,.55),0 0 0 1px rgba(242,177,52,.18),0 0 60px rgba(242,177,52,.08);overflow:visible;position:relative;animation:cardin .35s ease-out;background:#141a1f}

  .brand{position:relative}

<script>
// ============================================================
//  BLOCKFRONT — blocky wave-survival FPS
// ============================================================
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,rate,dt)=>lerp(a,b,1-Math.exp(-rate*dt));

function dampAngle(a,b,rate,dt){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*(1-Math.exp(-rate*dt));}

// ---------------- renderer / scene ----------------
const canvas=document.getElementById('c');

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.03,300);camera.rotation.order='YXZ';scene.add(camera);
const hemi=new THREE.HemisphereLight(0xc9dccf,0x3f5a33,0.58);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe9c8,1.0);sun.position.set(28,55,18);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-64,right:64,top:64,bottom:-64,near:10,far:170});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;scene.add(sun);
const fill=new THREE.DirectionalLight(0xb8cdf5,0.14);fill.position.set(-26,26,-22);scene.add(fill);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

// ---------------- textures ----------------
const texCache={},matCache={};
function blockTex(hex){
  if(texCache[hex])return texCache[hex];
  const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');const col=new THREE.Color(hex);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const n=rnd(-0.05,0.05)+((x===0||y===0)?-0.07:0);
    g.fillStyle=`rgb(${clamp((col.r+n)*255,0,255)|0},${clamp((col.g+n)*255,0,255)|0},${clamp((col.b+n)*255,0,255)|0})`;g.fillRect(x,y,1,1);}

function facadeTex(hex){ // one 3x3-unit tile of building facade with a window — replaces ~3000 window blocks in the Society
  const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');const col='#'+hex.toString(16).padStart(6,'0');
  g.fillStyle=col;g.fillRect(0,0,96,96);for(let i=0;i<220;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*0.08})`;g.fillRect(Math.random()*96|0,Math.random()*96|0,3,3);}

  if(!net.connected||!net.authed){deploy();return;}                                             // offline / no server: plain deploy
  if(!net.room){const q=net.lobbies.find(L=>L.quick);if(q)netSend({t:'join',room:q.id});activeTab='play';renderMenu();return;}   // PLAY = jump into Quick Play
  if(net.roomInfo&&net.roomInfo.quick){deploy();return;}                                          // quick play is always live
  if(net.isHost){if(!net.started)netSend({t:'start'});net.started=true;deploy();return;}         // host starts the match for everyone

let infAlarm=0,infRound=0,infTargets=0,infExtract=null,infNextT=0,infElapsed=0,infHint='';
function infNoise(pos,r){if(gameMode!=='inf')return;for(const e of enemies){if(!e.alive||e.aware)continue;const d=Math.hypot(e.pos.x-pos.x,e.pos.z-pos.z);if(d<r){e.suspicion=Math.max(e.suspicion||0,d<r*0.5?1.1:0.7);e.lastSeen=e.lastSeen||new THREE.Vector3();e.lastSeen.copy(pos);e.alertT=Math.max(e.alertT,4);}}}
let infReinforced=false,infEscapeT=-1,infRadioT=-1;
function infAlert(e){if(e.aware)return;e.aware=true;infAlarm=Math.min(1,infAlarm+0.34);SFX.beep();
  for(const o of enemies)if(o.alive&&!o.aware&&Math.hypot(o.pos.x-e.pos.x,o.pos.z-e.pos.z)<22){o.aware=true;}
  if(infAlarm<1){e.radioT=2.4;showMsg('SPOTTED — SILENCE HIM BEFORE HE RADIOS');}     // kill the spotter in 2.4 s or he calls it in
  else infFullAlert();}
function infFullAlert(){if(infAlarm>=1&&infReinforced)return;infAlarm=1;showMsg('ALARM — BASE ON ALERT. TARGETS ARE RUNNING.');SFX.wave();
  if(!infReinforced){infReinforced=true;for(let i=0;i<4+infRound*2;i++)spawnEnemy(i===0);}
  for(const o of enemies)if(o.alive){o.aware=true;o.alertT=99;}
  infEscapeT=45;}
function inLight(pos){for(const o of decor){if(!o.isPointLight||o.intensity<1)continue;const d=Math.hypot(o.position.x-pos.x,o.position.z-pos.z);if(d<o.distance*0.45)return true;}return false;}   // floodlit ground is a bad place to stand
function infPatrolPoint(e){const bd=MAPS[currentMap].bounds||[-50,50,-50,50];for(let t=0;t<30;t++){const x=e.pos.x+rnd(-18,18),z=e.pos.z+rnd(-18,18);if(x<bd[0]+3||x>bd[1]-3||z<bd[2]+3||z>bd[3]-3)continue;const gy=groundYAt(x,z);if(gy>6||gy<-0.5)continue;if(waterDepthAt(new THREE.Vector3(x,gy,z))>0.3)continue;return [x,z];}return [e.pos.x,e.pos.z];}

// ---------------- infiltration (alternate gamemode) ----------------
// Night. Raider patrols hold the map. Three marked targets are somewhere among them. Take them quietly and reach the
// extraction point; get seen and the base goes on alert. Each round: more patrols, more targets.
const infMarkers=[];
function infMark(kind,x,z,y){const el=document.createElement('div');el.className='obj'+(kind==='exit'?' exit':'');el.innerHTML='<i></i><span></span>';document.getElementById('objs').appendChild(el);infMarkers.push({kind,x,z,y,el});return infMarkers[infMarkers.length-1];}
function infClear(){for(const m of infMarkers)m.el.remove();infMarkers.length=0;infExtract=null;}
function startInfiltration(){
  infRound=1;infElapsed=0;infAlarm=0;infReinforced=false;infNextT=0;infClear();
  document.getElementById('wavelbl').textContent='round';document.getElementById('leftlbl').textContent='targets';document.getElementById('waven').textContent='1';
  infDeploy();showMsg('INFILTRATE — 3 TARGETS');SFX.wave();
}
function infMakeTarget(e){if(e.isTarget)return;e.isTarget=true;const mat=new THREE.MeshLambertMaterial({map:blockTex(0xd9a733)});e.torso.material=mat;e.mats.push(mat);const tl=new THREE.PointLight(0xffb45e,1.4,6);tl.position.set(0,2.6,0);e.group.add(tl);e.tagLight=tl;infMark('target',e.pos.x,e.pos.z,2.8).enemy=e;}
function infDeploy(){
  for(const e of enemies){scene.remove(e.group);}enemies.length=0;infClear();infAlarm=0;infReinforced=false;
  infEscapeT=-1;const n=7+infRound*3,targets=Math.min(3+Math.floor(infRound/2),6);infTargets=targets;
  for(let i=0;i<n+targets;i++){spawnEnemy(false);const e=enemies[enemies.length-1];e.pos.set(...(()=>{const p=infPatrolPoint({pos:new THREE.Vector3(rnd(-40,40),0,rnd(-40,40))});return [p[0],groundYAt(p[0],p[1])+0.3,p[1]];})());e.group.position.copy(e.pos);
    if(i<targets){e.hp=e.maxHp=e.maxHp*1.5;infMakeTarget(e);for(let g=0;g<2;g++){spawnEnemy(false);const b=enemies[enemies.length-1];b.pos.set(e.pos.x+rnd(-3,3),e.pos.y,e.pos.z+rnd(-3,3));b.group.position.copy(b.pos);b.patrol=[b.pos.x,b.pos.z];b.patrolT=9e9;b.pauseT=9e9;b.guardOf=e;}}}
  const far=spawnPoints.slice().sort((a,b)=>nearestPlayerDist(b[0],b[1])-nearestPlayerDist(a[0],a[1]))[0]||[0,0];infExtract={x:far[0]*0.9,z:far[1]*0.9};
}
function updateInfiltration(dt){
  infElapsed+=dt;infHint='';const isSim=!(net.connected&&!net.isHost);
  const left=enemies.filter(e=>e.alive&&e.isTarget).length;document.getElementById('leftn').textContent=left;
  if(isSim){ if(infAlarm>0&&infAlarm<1)infAlarm=Math.max(0,infAlarm-dt*0.006);
    if(infEscapeT>0){infEscapeT-=dt;document.getElementById('alarmbar').querySelector('span').textContent='TARGETS ESCAPE IN '+Math.ceil(infEscapeT)+'s';
      if(infEscapeT<=0&&enemies.some(e=>e.alive&&e.isTarget)){showMsg('TARGETS ESCAPED — ROUND FAILED');SFX.heavySwing();infEscapeT=-1;infDeploy();return;}}
    // footsteps: sprinting is loud, walking is audible, crouching is quiet
    infNextT-=dt;if(infNextT<=0){infNextT=0.45;const hs=Math.hypot(P.vel.x,P.vel.z);if(hs>0.5&&P.grounded)infNoise(P.pos,P.crouch?2.5:hs>6.5?11:5.5);
      if(net.connected)for(const rp of net.players.values())if(!rp.dead&&rp.sp>0.5)infNoise(rp.pos,rp.crouch?2.5:rp.sp>6.5?11:5.5);} }

// ---------------- input ----------------
function onDown(code){
  if(rebinding){binds[rebinding]=code;rebinding=null;saveBinds();renderMenu();return true;}
  keys[code]=true;
  if(code===binds.jump)input.jumpBuffer=0.15;
  if(code===binds.crouch)input.crouchEdge=true;
  if(code===binds.fire){input.fire=true;input.firePressed=true;}
  if(code===binds.aim){input.aim=true;input.aimPressed=true;}
  if(state==='playing'){
    if(code===binds.slot1)switchWeapon(0);if(code===binds.slot2)switchWeapon(1);if(code===binds.slot3)switchWeapon(2);if(code===binds.slot4)switchWeapon(3);
    if(code===binds.last)switchWeapon(W.last);if(code===binds.detonate)input.detonate=true;
    if(code===binds.view){TP=!TP;SFX.swap();}
  }
  return false;
}
function onUp(code){keys[code]=false;if(code===binds.fire)input.fire=false;if(code===binds.aim)input.aim=false;}
addEventListener('keydown',e=>{
  if(e.repeat){keys[e.code]=true;return;}
  if(perkChoice&&(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3')){perkTake(perkChoice[+e.code.slice(5)-1]);e.preventDefault();return;}
  if(e.code==='Tab'&&state==='playing'){renderBoard();document.getElementById('board').classList.add('on');e.preventDefault();}
  if(e.code===binds.interact&&!e.repeat)input.interactPressed=true;if(e.code==='KeyF'&&!e.repeat)input.friendPressed=true;
  if(friendReq.from!==null&&(e.code==='KeyY'||e.code==='KeyN')){const acc=e.code==='KeyY';const from=friendReq.from,nm=friendReq.name;friendReq.from=null;document.getElementById('duelprompt').classList.remove('on');netSend({t:'friend',to:from,act:acc?'acc':'dec',name:net.name});if(acc)showMsg('FRIENDS WITH '+nm.toUpperCase());return;}
  if(duel.incoming!==null&&(e.code==='KeyY'||e.code==='KeyN')){const acc=e.code==='KeyY';const from=duel.incoming;const nm=duel.incomingName;duel.incoming=null;document.getElementById('duelprompt').classList.remove('on');netSend({t:'duel',to:from,act:acc?'acc':'dec',name:net.name});if(acc)startDuel(from,nm);return;}
  if(rebinding&&e.code==='Escape'){rebinding=null;renderMenu();return;}
  const consumed=onDown(e.code);

});

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='playing'){
    time+=dt;updatePlayer(dt);updateWeapons(dt);
    for(const e of enemies)e.update(dt);
    for(let i=enemies.length-1;i>=0;i--)if(!enemies[i].alive)enemies.splice(i,1);
    for(let i=0;i<enemies.length;i++){const a=enemies[i];
      for(let j=i+1;j<enemies.length;j++){const b=enemies[j];const dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,d=Math.hypot(dx,dz);
        if(d<0.9&&d>0.001){const p=(0.9-d)*0.5;a.pos.x-=dx/d*p;a.pos.z-=dz/d*p;b.pos.x+=dx/d*p;b.pos.z+=dz/d*p;if(overlaps(a)){a.pos.x+=dx/d*p;a.pos.z+=dz/d*p;}if(overlaps(b)){b.pos.x-=dx/d*p;b.pos.z-=dz/d*p;}}}
      const dx=a.pos.x-P.pos.x,dz=a.pos.z-P.pos.z,d=Math.hypot(dx,dz);
      if(d<0.85&&d>0.001&&Math.abs(a.pos.y-P.pos.y)<1.8){const p=0.85-d,ox=a.pos.x,oz=a.pos.z;a.pos.x+=dx/d*p;a.pos.z+=dz/d*p;if(overlaps(a)){a.pos.x=ox;a.pos.z=oz;}}
    }
    updatePerks(dt);updateProjectiles(dt);if(gameMode==='demo')updateDemolition(dt);else if(gameMode==='inf')updateInfiltration(dt);else if(gameMode==='ffa'){}else if(!(net.connected&&!net.isHost))updateWaves(dt);updateSims(dt);updateSlash(dt);updateHazards(dt);updateHUD(dt);netTick(dt);
  }else if(state==='hub'){document.body.classList.add('inhub');time+=dt;updatePlayer(dt);updateWeapons(dt);updateSims(dt);updateHub(dt);netTick(dt);updateHUD(dt);}
  else if(state==='hubmenu'){time+=dt*0.2;updateSims(dt);netTick(dt);}
  else if(state==='dead'){time+=dt;updateProjectiles(dt);updateSims(dt);updateHUD(dt);for(const e of enemies)e.update(dt);if(respawnT>0){respawnT-=dt;if(respawnT<=0)pvpRespawn();}if(net.connected){if(net.isHost){if(gameMode==='demo')updateDemolition(dt);else updateWaves(dt);updateHazards(dt);}netTick(dt);}}
  else if(state==='menu'&&P.dead){time+=dt;updateSims(dt);if(net.connected){if(net.isHost&&enemies.length){updateProjectiles(dt);for(const e of enemies)e.update(dt);if(gameMode==='demo')updateDemolition(dt);else updateWaves(dt);}netTick(dt);}}
  else{time+=dt*0.2;updateSims(dt);if(W.slots[0])updateWeaponPose(dt);}
  updateCamera(dt);
  updateWater(time,dt);
  if(whiteA>0){whiteA=Math.max(0,whiteA-dt*0.35);document.getElementById('wflash').style.opacity=Math.min(1,whiteA).toFixed(2);}
  const uwd=waterDepthAt(camera.position);document.getElementById('uw').classList.toggle('on',uwd>0.05);if(scene.fog){const m=MAPS[currentMap];if(uwd>0.05){scene.fog.near=2;scene.fog.far=28;scene.fog.color.setHex(0x1e5a78);}else{const nk=gameMode==='inf'?0.55:1;scene.fog.near=m.fog[0]*Q.fog*nk;scene.fog.far=m.fog[1]*Q.fog*nk;if(gameMode!=='inf')scene.fog.color.setHex(m.sky);}}
  frameNo++;if(renderer.shadowMap.enabled){renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=(frameNo&1)===0;}
  renderer.render(scene,camera);
  if(state!=='playing')renderPreview(dt);
}
loadMap('forest');equipLoadout();equipped=loadout.join(',');{const st=MAPS.forest.start;P.pos.set(st[0],st[1],st[2]);}
updateCamera(0);
requestAnimationFrame(frame);
</script>
